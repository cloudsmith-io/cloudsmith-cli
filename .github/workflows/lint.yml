name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
  merge_group:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: python uv

      - run: uv sync --locked --group dev

      # The cached hook virtualenvs point at the interpreter, so key on the
      # Python version in mise.lock as well as the hook config.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', '.pre-commit-config.yaml') }}

      - run: uv run pre-commit run --all-files
