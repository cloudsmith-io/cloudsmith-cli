name: binaries

on:
  workflow_dispatch:
    inputs:
      online_smoketest:
        description: Run read-only online smoketests
        type: boolean
        default: true
  workflow_call:
    inputs:
      online_smoketest:
        description: Run read-only online and OIDC smoketests
        type: boolean
        required: false
        default: false
    secrets:
      CLOUDSMITH_API_KEY:
        description: Read-only API key for the online smoketests
        required: false
  push:
    branches:
      - master
    paths:
      - cloudsmith_cli/**
      - packaging/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/scripts/**
      - .github/workflows/binaries.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - cloudsmith_cli/**
      - packaging/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/scripts/**
      - .github/workflows/binaries.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Smoke tests are development noise: keep them out of CLI telemetry.
  CLOUDSMITH_NO_TELEMETRY: "1"

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Validate Python distributions
        run: |
          set -euo pipefail
          uv sync --locked --group release
          uv build --clear
          uv run --group release twine check dist/*
          uv run --group release check-wheel-contents dist/*.whl
          python .github/scripts/check_wheel.py

  matrix:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MATRIX=$(
            jq -c --arg event_name "${EVENT_NAME}" \
              '{include: [.include[] | select($event_name != "pull_request" or .pr) | del(.pr)]}' \
              .github/scripts/binaries-matrix.json
          )
          test "$(echo "${MATRIX}" | jq '.include | length')" -gt 0
          echo "include=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJson(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.build_runner }}
    timeout-minutes: 45
    env:
      PYTHON_VERSION: "3.14.10"
      UV_VERSION: "0.13.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.mode == 'native'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - if: matrix.mode == 'native'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - id: art
        shell: bash
        env:
          TARGET: ${{ matrix.name }}
          ARCHIVE: ${{ matrix.archive }}
        run: echo "name=cloudsmith-$(cat cloudsmith_cli/data/VERSION)-${TARGET}${ARCHIVE}" >> "$GITHUB_OUTPUT"

      # cryptography has no Intel macOS wheel, so uv builds it from source.
      # A dynamic build loads a libssl.3.dylib that PyInstaller can replace
      # with an older copy. Static OpenSSL removes that dependency. Remove the
      # cached build, because uv reuses it even when the build settings change.
      - if: matrix.name == 'macos-x86_64'
        shell: bash
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          uv cache clean cryptography

      - if: matrix.mode == 'native'
        shell: bash
        env:
          ART: ${{ steps.art.outputs.name }}
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyinstaller
        run: |
          set -euo pipefail
          uv sync --locked --no-dev --no-editable --group binary --extra all --python "${PYTHON_VERSION}"
          uv run --no-sync pyinstaller --clean --noconfirm packaging/pyinstaller/cloudsmith.spec
          mkdir -p out
          case "${ART}" in
            *.zip) (cd dist && 7z a -bso0 "../out/${ART}" cloudsmith) ;;
            *)     tar -czf "out/${ART}" -C dist cloudsmith ;;
          esac

      - if: matrix.mode == 'alpine'
        env:
          ART: ${{ steps.art.outputs.name }}
          BUILD_IMAGE: ${{ matrix.build_image }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -e ART="${ART}" \
            -e UV_VERSION \
            -e UV_PYTHON_DOWNLOADS=never \
            -e PYINSTALLER_CONFIG_DIR=/tmp/pyinstaller \
            -v "${PWD}:/src" -w /src \
            "${BUILD_IMAGE}" sh -c '
              set -eu
              apk add --no-cache build-base zlib-dev libffi-dev >/dev/null
              python -m pip install --root-user-action=ignore "uv==${UV_VERSION}" >/dev/null
              uv sync --locked --no-dev --no-editable --group binary --extra all
              uv run --no-sync pyinstaller --clean --noconfirm packaging/pyinstaller/cloudsmith.spec
              tar -czf "out/${ART}" -C dist cloudsmith
            '

      - if: matrix.mode == 'glibc'
        env:
          ART: ${{ steps.art.outputs.name }}
          BUILD_IMAGE: ${{ matrix.build_image }}
        run: |
          set -euo pipefail
          mkdir -p out
          # AlmaLinux 8 has no Python 3.14 package. Copy uv from its image, and let uv install Python 3.14.10.
          UV_CONTAINER="$(docker create "ghcr.io/astral-sh/uv:${UV_VERSION}")"
          docker cp "${UV_CONTAINER}:/uv" "${RUNNER_TEMP}/uv"
          docker rm "${UV_CONTAINER}" >/dev/null
          docker run --rm \
            -e ART="${ART}" \
            -e PYTHON_VERSION \
            -e PYINSTALLER_CONFIG_DIR=/tmp/pyinstaller \
            -v "${RUNNER_TEMP}/uv:/usr/local/bin/uv:ro" \
            -v "${PWD}:/src" -w /src \
            "${BUILD_IMAGE}" bash -c '
              set -euo pipefail
              dnf install -y gcc binutils file >/dev/null
              uv sync --locked --no-dev --no-editable --group binary --extra all --managed-python --python "${PYTHON_VERSION}"
              uv run --no-sync pyinstaller --clean --noconfirm packaging/pyinstaller/cloudsmith.spec
              MAXV="$(
                while IFS= read -r -d "" candidate; do
                  if file "${candidate}" | grep -q ELF; then
                    objdump -T "${candidate}" 2>/dev/null \
                      | grep -oE "GLIBC_[0-9.]+" || true
                  fi
                done < <(find dist/cloudsmith -type f -print0) \
                  | sed "s/GLIBC_//" | sort -V | tail -1
              )"
              test -n "${MAXV}"
              echo "glibc floor: ${MAXV}"
              # glibc 2.28 is the oldest supported glibc (RHEL 8). Do not raise it to suit a newer build image.
              if [ "$(printf "2.28\n%s\n" "${MAXV}" | sort -V | tail -1)" != "2.28" ]; then
                echo "FAIL: glibc floor ${MAXV} exceeds 2.28"
                exit 1
              fi
              tar -czf "out/${ART}" -C dist cloudsmith
            '

      - shell: bash
        env:
          ART: ${{ steps.art.outputs.name }}
        run: |
          set -euo pipefail
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ART}" | tee "${ART}.sha256"
          else
            shasum -a 256 "${ART}" | tee "${ART}.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudsmith-${{ matrix.name }}
          path: out/
          retention-days: 14
          if-no-files-found: error

  test:
    needs: [matrix, build]
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJson(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.test_runner }}
    timeout-minutes: 25
    env:
      ONLINE: ${{ inputs.online_smoketest && '1' || '' }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: art
        shell: bash
        env:
          TARGET: ${{ matrix.name }}
          ARCHIVE: ${{ matrix.archive }}
        run: echo "name=cloudsmith-$(cat cloudsmith_cli/data/VERSION)-${TARGET}${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudsmith-${{ matrix.name }}
          path: ./dl

      - name: Verify archive and checksum
        shell: bash
        env:
          ART: ${{ steps.art.outputs.name }}
        run: |
          set -euo pipefail
          test -f "dl/${ART}"
          test -f "dl/${ART}.sha256"
          cd dl
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${ART}.sha256"
          else
            shasum -a 256 -c "${ART}.sha256"
          fi
          case "${ART}" in
            *.zip)
              7z l -slt "${ART}" \
                | sed -n 's/^Path = //p' \
                | sed 's#\\#/#g' \
                | tail -n +2 \
                > entries.txt
              ;;
            *) tar -tzf "${ART}" > entries.txt ;;
          esac
          test -s entries.txt
          if grep -Eq '(^|/)\.\.(/|$)|^/' entries.txt; then
            echo "archive contains an unsafe path"
            exit 1
          fi
          if grep -Ev '^cloudsmith(/|$)' entries.txt; then
            echo "archive contains files outside cloudsmith/"
            exit 1
          fi
          grep -Eq '^cloudsmith/cloudsmith(\.exe)?$' entries.txt

      - name: Require credentials for requested online smoketests
        if: inputs.online_smoketest
        shell: bash
        run: test -n "${CLOUDSMITH_API_KEY:-}"

      # The gnu test images check glibc compatibility. Each image has a glibc older than a
      # current build image: Debian 11 (2.31), AlmaLinux 8 (2.28, RHEL 8), Rocky Linux 9
      # (2.34, RHEL 9) and Amazon Linux 2023 (2.34). Keep them in binaries-matrix.json.
      - if: matrix.test_kind == 'docker'
        env:
          ART: ${{ steps.art.outputs.name }}
          TEST_IMAGES: ${{ matrix.test_images }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(cat cloudsmith_cli/data/VERSION)
          export EXPECTED_VERSION
          tar -xzf "dl/${ART}" -C .
          ASSERT_NO_PYTHON=1
          for IMAGE in ${TEST_IMAGES}; do
            docker run --rm \
              -e ASSERT_NO_PYTHON="${ASSERT_NO_PYTHON}" \
              -e EXPECTED_VERSION \
              -e CLOUDSMITH_NO_TELEMETRY \
              -v "${PWD}:/w" -w /w \
              "${IMAGE}" sh -c '
                if [ "${ASSERT_NO_PYTHON}" = 1 ]; then
                  for candidate in python python3 python3.11 python3.12 python3.13 python3.14 pypy3; do
                    if command -v "${candidate}" >/dev/null 2>&1; then
                      echo "${candidate} present in clean-room image"
                      exit 1
                    fi
                  done
                fi
                sh packaging/smoketest.sh cloudsmith/cloudsmith offline
              '
            ASSERT_NO_PYTHON=0
          done
          if [ -n "${ONLINE}" ] && [ -n "${CLOUDSMITH_API_KEY:-}" ]; then
            IMAGE=${TEST_IMAGES%% *}
            docker run --rm \
              -e CLOUDSMITH_API_KEY \
              -e CLOUDSMITH_NAMESPACE \
              -e CLOUDSMITH_NO_TELEMETRY \
              -v "${PWD}:/w" -w /w \
              "${IMAGE}" sh -c '
                sh packaging/smoketest.sh cloudsmith/cloudsmith online
              '
          fi

      - if: matrix.test_kind == 'macos'
        env:
          ART: ${{ steps.art.outputs.name }}
        run: |
          set -euo pipefail
          export EXPECTED_VERSION
          EXPECTED_VERSION=$(cat cloudsmith_cli/data/VERSION)
          tar -xzf "dl/${ART}" -C .
          # env -i drops the workflow's CLOUDSMITH_NO_TELEMETRY; pass it again.
          env -i HOME="${HOME}" TMPDIR="${TMPDIR:-/tmp}" CLOUDSMITH_NO_TELEMETRY=1 \
            "${PWD}/cloudsmith/cloudsmith" --version
          sh packaging/smoketest.sh cloudsmith/cloudsmith offline
          if [ -n "${ONLINE}" ] && [ -n "${CLOUDSMITH_API_KEY:-}" ]; then
            sh packaging/smoketest.sh cloudsmith/cloudsmith online
          fi

      - if: matrix.test_kind == 'windows'
        shell: bash
        env:
          ART: ${{ steps.art.outputs.name }}
        run: |
          set -euo pipefail
          export EXPECTED_VERSION
          EXPECTED_VERSION=$(cat cloudsmith_cli/data/VERSION)
          7z x -bso0 "dl/${ART}" -o.
          sh packaging/smoketest.sh cloudsmith/cloudsmith.exe offline
          if [ -n "${ONLINE}" ] && [ -n "${CLOUDSMITH_API_KEY:-}" ]; then
            sh packaging/smoketest.sh cloudsmith/cloudsmith.exe online
          fi

  oidc:
    needs: [matrix, build]
    if: ${{ inputs.online_smoketest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      CLOUDSMITH_ORG: ${{ vars.CLOUDSMITH_NAMESPACE }}
      CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudsmith-linux-x86_64-gnu
          path: ./dl

      - name: Authenticate through GitHub OIDC
        run: |
          set -euo pipefail
          VERSION=$(cat cloudsmith_cli/data/VERSION)
          ART="cloudsmith-${VERSION}-linux-x86_64-gnu.tar.gz"
          test -f "dl/${ART}"
          tar -xzf "dl/${ART}" -C .
          unset CLOUDSMITH_API_KEY
          OUT=$(cloudsmith/cloudsmith whoami 2>&1) || {
            printf '%s\n' "$OUT"
            exit 1
          }
          printf '%s\n' "$OUT"
          if printf '%s' "$OUT" | grep -qiE 'anonymous|Nobody'; then
            echo "FAIL: OIDC auth did not occur"
            exit 1
          fi
