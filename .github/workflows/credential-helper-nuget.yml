name: NuGet credential provider

on:
  push:
    branches:
      - master
    paths:
      - "cloudsmith_cli/**"
      - ".github/scripts/nuget_*"
      - ".github/workflows/credential-helper-nuget.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - "**"
    paths:
      - "cloudsmith_cli/**"
      - ".github/scripts/nuget_*"
      - ".github/workflows/credential-helper-nuget.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # A real `dotnet restore` authenticates to a local mock of a private
    # Cloudsmith NuGet feed through the installed `nuget-plugin-cloudsmith`
    # launcher, using a custom domain found by install-time and runtime
    # discovery against a mock custom-domains API. No secrets are needed.
    name: dotnet restore (${{ matrix.os }}, .NET ${{ matrix.dotnet }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # NuGet discovers `nuget-plugin-*` on PATH from .NET SDK 9.0.200.
          - os: ubuntu-24.04
            dotnet: "9.0.x"
          - os: ubuntu-24.04
            dotnet: "10.0.x"
          - os: macos-15
            dotnet: "10.0.x"
          - os: windows-2025
            dotnet: "10.0.x"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up .NET ${{ matrix.dotnet }}
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Install the CLI
        shell: bash
        run: |
          uv sync --locked --python 3.12
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "${GITHUB_PATH}"
          else
            echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          fi

      - name: Run the end-to-end test
        shell: bash
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          cloudsmith --version
          .github/scripts/nuget_credential_provider_e2e.sh
