name: Container Image Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
permissions:
  contents: read

concurrency:
  group: image-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Only master pushes write the layer cache; pull requests only read it.
      - name: Build image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CACHE_TO=()
          if [ "${EVENT_NAME}" = "push" ]; then
            CACHE_TO=(--cache-to type=gha,mode=max)
          fi
          docker buildx build \
            --load \
            --cache-from type=gha \
            "${CACHE_TO[@]}" \
            --tag cloudsmith-io/cli-dev \
            --file dev.Dockerfile \
            --build-arg CLOUDSMITH_CLI_VERSION="$(cat VERSION)" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            .
      - name: Test image
        run: docker run -t cloudsmith-io/cli-dev --help
