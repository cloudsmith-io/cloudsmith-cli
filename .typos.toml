[default]
# PostHog project keys (usage telemetry) are random text, not words.
extend-ignore-re = ["phc_[A-Za-z0-9]+"]

[default.extend-identifiers]
# Proper names - do not correct
Mno-hime = "Mno-hime"

[default.extend-words]
# Proper names - do not correct
hime = "hime"
# PyInstaller spec API: Analysis(datas=...) — not a typo of "data"
datas = "datas"
McClory = "McClory"
mcclory = "mcclory"
Clory = "Clory"
repositor = "repositor"
