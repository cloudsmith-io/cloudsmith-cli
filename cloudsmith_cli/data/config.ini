# Default configuration
[default]
# The API host to connect to (default: api.cloudsmith.io).
api_host=

# The proxy to connect through for all HTTP requests (default: None).
# api_proxy is accepted as a compatibility alias.
proxy=

# Whether to verify SSL certificates for HTTPS connections (default: True).
# api_ssl_verify is accepted as a compatibility alias.
ssl_verify=

# Whether to apply strict X.509 certificate verification (VERIFY_X509_STRICT),
# which Python 3.13+ enables by default. Set to false if a TLS-intercepting
# proxy issues certificates that fail strict checks (default: True)
ssl_verify_strict=true

# The user agent to use for requests (default: calculated).
api_user_agent=

# The Cloudsmith Workspace slug (default: None).
workspace=

# Whether to check once a day for a newer version of the CLI (default: True).
check_for_update=

# Profile-based configuration
# You can set as many additional profiles as you need to provide
# for different configuration environments (e.g. prod vs staging).
# Add your overrides in the sections and then specify one of:
#  * -P your-profile-name (as an argument)
#  * --profile your-profile-name (an an argument)
#  * CLOUDSMITH_PROFILE=your-profile-name (as an env variable)
[profile:your-profile-name]
