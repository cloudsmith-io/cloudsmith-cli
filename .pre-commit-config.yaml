# Pre-Commit hooks
# See: https://pre-commit.com/hooks.html
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-added-large-files
  - id: check-ast
  - id: check-builtin-literals
  - id: check-byte-order-marker
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
  - id: debug-statements
  - id: detect-aws-credentials
    args: ['--allow-missing-credentials']
  - id: detect-private-key
    exclude: >
      (?x)^(
        .bumpversion.cfg
      )$
  - id: end-of-file-fixer
    exclude: >
      (?x)^(
        \.bumpversion\.cfg
      )$
  - id: forbid-new-submodules
  - id: name-tests-test
    args: ['--django']
    exclude: >
      (?x)^(
        cloudsmith/.*/tests/apps\.py|
        cloudsmith/.*/tests/enums\.py|
        cloudsmith/.*/tests/factories\.py|
        cloudsmith/.*/tests/forms\.py|
        cloudsmith/.*/tests/models\.py|
        cloudsmith/.*/tests/mixins\.py|
        cloudsmith_cli/.*/tests/utils\.py|
        cloudsmith/.*/tests/views\.py
      )$
  - id: trailing-whitespace

- repo: https://github.com/pycqa/flake8
  rev: '7.1.2'
  hooks:
  - id: flake8
    args: ['--config=.flake8']

- repo: https://github.com/asottile/pyupgrade
  rev: v3.21.2
  hooks:
  - id: pyupgrade
    args: [--py310-plus]


- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.20.0
  hooks:
  - id: zizmor

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.1
  hooks:
    - id: ruff-format
      args: ['--check', '--output-format', 'github']
    - id: ruff-check

- repo: https://github.com/crate-ci/typos
  rev: v1.42.1
  hooks:
    - id: typos
